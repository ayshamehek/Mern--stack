<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h4>List</h4>
    <h5>Unordered List </h5>
<ul>
    <li>Strawberry</li>
    <li>Mango</li>
    <li>Grapes</li>
</ul>
<h5>Ordered List</h5>
<ol>
    <li>Maths</li>
    <li>Science</li>
    <li>English</li>
</ol>
<h5>Description List</h5>
<dl>
    <dt>HTML:</dt>
    <dd>HyperText Markup Language this is the markup language used to give the structure of the web page</dd>
    <dt>CSS:</dt>
    <dd>Cascading Style Sheet</dd>
</dl>
</body>
</html>
