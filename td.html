<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    table, th, td{
        border:1px solid black;
    }
</style>
<body>
    <h2>TD elements define table cells</h2>
    <table style="width:50%">
        <tr>
            <td>Emil</td>
            <td>Tobies</td>
            <td>Linus</td>
        </tr>
    </table>
    <p>To understand the example better, we have added borders in the table</p>
</body>
</html>
