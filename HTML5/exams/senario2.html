<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Student Registration Form </title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <hr><br>
    <form>
        <label for="name"><b>Name:</b></label>
       <input type="text" id="name" name="name" required><br><br>
       <label for="StdId"><b>StudentId:</b></label>
       <input type="text" id="Stdid" name="StdId" required><br><br>
       <label for="email"><b>Email:</b></label>
       <input type="email" id="email" name="email" required><br><br>
       <label for="mobile Number"><b>Mobile Number:</b></label>
       <input type="text" id="mobile Number" name="mobile Number"><br><br>
       <label for="gender"><b>Gender:</b></label>
       <input type="radio" id="male" name="gender" value="male">
       <label for="male">Male</label>
       <input type="radio" id="female" name="gender" value="female">
       <label for="female">Female:</label><br><br>
       <label for="Course"><b>Course:</b></label>
       <select name="course">
        <option>BBA</option>
        <option>B.COM</option>
        <option>BCA</option>
        <option>MBA</option>
        <option>M.COM</option>
        <option>MCA</option>
       </select><br><br>
       <label for="Skills"><b>Skills:</b></label>
       <input type="checkbox" id="skills" name="skills" value="skills">
       <label for="wifi">WIFi</label>
       <input type="checkbox" id="skills">
       <label for="Laboratory">Laboratory</label>
       <input type="checkbox" id="skills">
       <label for="Baach View">Beach View</label>
       <input type="checkbox" id="skills" >
       <label for="Dance Room">Dance Room</label><br><br>
       <label for="Address"><b>Address:</b></label><br>
       <textarea id="address" name="address" rows="3" cols="40" required></textarea><br><br>
       <button type="submit">Submit:</button>
       <button type="clear">Clear</button>
       <button type="Reset">Reset</button>
      </form>
</body>
</html>
